version: 3
workdir: .

allow:
  deepScan: true
  depOnAnyVendor: false
  ignoreNotFoundComponents: true

excludeFiles:
  - '.*_test\.go$'

components:
  api: {in: api/**}
  postgres: {in: internal/postgres/**}
  controller: {in: internal/controller/**}
  main: {in: cmd/**}
  support: {in: [test/**, bin/**, artifacts/**, tools/**, .agent-plans/**, .git/**]}

vendors:
  apimachinery: {in: k8s.io/apimachinery/**}
  core: {in: k8s.io/api/core/v1}
  client: {in: k8s.io/client-go/**}
  runtime: {in: [sigs.k8s.io/controller-runtime, sigs.k8s.io/controller-runtime/**]}
  pgx: {in: [github.com/jackc/pgx/v5, github.com/jackc/pgx/v5/**]}
  stringprep: {in: github.com/xdg-go/stringprep}

deps:
  api:
    canUse: [apimachinery]
  postgres:
    mayDependOn: [api]
    canUse: [pgx, core, stringprep]
  controller:
    mayDependOn: [api, postgres]
    canUse: [core, apimachinery, client, runtime]
  main:
    mayDependOn: [api, controller, postgres]
    canUse: [apimachinery, client, runtime]
  support:
    anyProjectDeps: true
    anyVendorDeps: true
    deepScan: false
