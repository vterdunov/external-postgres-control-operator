apiVersion: postgresql.epco.io/v1alpha1
kind: ExternalPostgres
metadata:
  name: pg-prod
spec:
  connection:
    host: pg-primary.example.com
  credentialsSecret:
    name: pg-admin
---
apiVersion: postgresql.epco.io/v1alpha1
kind: DatabaseRole
metadata:
  name: llm-agent
spec:
  cluster:
    name: pg-prod
  name: llm_agent
  login: true
  passwordSecret:
    name: llm-agent-credentials
  inRoles: []
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.epco.io/v1alpha1
kind: Database
metadata:
  name: orders
spec:
  cluster:
    name: pg-prod
  name: orders
  owner: orders_owner
  permissions:
    connect:
      - role: llm_agent
  schemas:
    - name: app
      permissions:
        usage:
          - role: llm_agent
      tablePermissions:
        - role: llm_agent
          tables: [orders]
          privileges: [select]
        - role: llm_agent
          tables: [invoices]
          privileges: [select]
  databaseReclaimPolicy: retain
