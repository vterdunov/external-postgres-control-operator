apiVersion: postgresql.epco.io/v1alpha1
kind: DatabaseRole
metadata:
  name: orders-service
spec:
  cluster:
    name: pg-prod
  name: orders_service
  login: true
  passwordGeneration:
    secretName: orders-service-credentials
---
apiVersion: postgresql.epco.io/v1alpha1
kind: DatabaseRole
metadata:
  name: orders-admin-readonly
spec:
  cluster:
    name: pg-prod
  name: orders_admin_readonly
  login: true
  passwordGeneration:
    secretName: orders-admin-readonly-credentials
---
apiVersion: postgresql.epco.io/v1alpha1
kind: Database
metadata:
  name: orders
spec:
  cluster:
    name: pg-prod
  name: orders
  owner: orders_service
  connectionSecrets:
    - name: orders-service-db
      roleRef:
        name: orders-service
    - name: orders-admin-readonly-db
      roleRef:
        name: orders-admin-readonly
  permissions:
    connect:
      - name: public
        ensure: absent
      - name: orders_service
      - name: orders_admin_readonly
    temporary:
      - name: public
        ensure: absent
  schemas:
    - name: public
      owner: orders_service
      permissions:
        usage:
          - name: orders_service
          - name: orders_admin_readonly
        create:
          - name: public
            ensure: absent
        tables:
          select:
            - name: orders_admin_readonly
      defaultPrivileges:
        - forRole: orders_service
          tables:
            select:
              - name: orders_admin_readonly
