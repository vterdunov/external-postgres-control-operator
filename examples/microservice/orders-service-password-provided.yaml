apiVersion: v1
kind: Secret
metadata:
  name: orders-service-credentials
type: kubernetes.io/basic-auth
stringData:
  username: orders_service
  password: replace-with-your-password
---
apiVersion: postgresql.epco.io/v1alpha1
kind: DatabaseRole
metadata:
  name: orders-service
spec:
  cluster:
    name: pg-prod
  name: orders_service
  login: true
  passwordSecret:
    name: orders-service-credentials
