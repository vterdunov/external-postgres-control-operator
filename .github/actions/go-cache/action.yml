name: Cache Go dependencies and build outputs
description: Persist caches for the mise-selected Go toolchain without skipping checks

inputs:
  scope:
    description: Build cache consumer, shared by jobs with the same Go workload
    required: true

runs:
  using: composite
  steps:
    - name: Resolve Go cache paths and runner image
      id: go
      shell: bash
      env:
        CACHE_IDENTITY: ${{ inputs.scope == 'lint' && hashFiles('go.mod', 'go.sum', '.custom-gcl.yml', 'mise.toml', 'mise.lock') || hashFiles('go.mod', 'go.sum') }}
      run: |
        go_build_cache="$(mise exec -- go env GOCACHE)"
        go_module_cache="$(mise exec -- go env GOMODCACHE)"
        go_version="$(mise exec -- go env GOVERSION)"
        printf 'build=%s\nmodules=%s\nversion=%s\nimage=%s\nidentity=%s\n' \
          "$go_build_cache" "$go_module_cache" "$go_version" "${ImageOS:-$RUNNER_OS}" \
          "$CACHE_IDENTITY" >> "$GITHUB_OUTPUT"
    - name: Cache Go modules
      id: modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'
      with:
        path: ${{ steps.go.outputs.modules }}
        key: go-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.image }}-${{ steps.go.outputs.version }}-${{ inputs.scope == 'lint' && 'lint' || 'project' }}-${{ steps.go.outputs.identity }}
        restore-keys: |
          go-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.image }}-${{ steps.go.outputs.version }}-${{ inputs.scope == 'lint' && 'lint' || 'project' }}-
          ${{ inputs.scope == 'lint' && format('go-modules-v1-{0}-{1}-{2}-{3}-project-', runner.os, runner.arch, steps.go.outputs.image, steps.go.outputs.version) || '' }}
    - name: Complete Go module cache
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: mise exec -- go mod download
    - name: Cache Go build outputs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'
      with:
        path: ${{ steps.go.outputs.build }}
        key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.image }}-${{ steps.go.outputs.version }}-${{ inputs.scope }}-${{ steps.go.outputs.identity }}-${{ hashFiles('**/*.go') }}
        restore-keys: |
          go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.image }}-${{ steps.go.outputs.version }}-${{ inputs.scope }}-${{ steps.go.outputs.identity }}-
          go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.image }}-${{ steps.go.outputs.version }}-${{ inputs.scope }}-
