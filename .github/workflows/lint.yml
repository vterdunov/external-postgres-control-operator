name: Public checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  public:
    name: Units, build and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up mise and pinned tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.15
      - name: Set up Go without shared caches
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run public units, build, vet, lint, generation and manifest checks
        run: mise run check
      - name: Repeat public unit seeds on scheduled and manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          for run in 2 3; do
            EPCO_TEST_SEED="$(( $(date +%s) + run ))" EPCO_ARTIFACTS_DIR="$PWD/artifacts/unit/$run" mise run test-unit
          done
      - name: Validate workflows
        run: mise exec -- actionlint
      - name: Verify checks left tracked sources unchanged
        if: always()
        run: git diff --exit-code
