name: Lint

on:
  push:
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned mise
        run: |
          curl --fail --location --retry 3 https://github.com/jdx/mise/releases/download/v2026.9.15/mise-v2026.9.15-linux-x64.tar.gz -o "$RUNNER_TEMP/mise.tar.gz"
          tar -xzf "$RUNNER_TEMP/mise.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/mise/bin" >> "$GITHUB_PATH"
      - name: Install pinned tools
        run: |
          mise trust mise.toml
          mise install
      - name: Lint Go and suite runners
        run: mise run lint
      - name: Validate workflows
        run: mise exec -- go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
