name: E2E Tests

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'tools/release.py'
      - 'tools/release_ci.py'
      - 'test/release/**'
      - 'test/e2e/run.sh'
      - 'test/e2e/runner_test.sh'
      - 'test/e2e/fixture_overlay.py'
      - 'test/e2e/fixtures/migration.sh'
      - 'test/e2e/fixture_overlay_test.py'
      - 'test/e2e/migration_fixture_test.py'
      - 'charts/**'
      - 'docs/**'
      - '.github/workflows/release-image.yml'
      - '.github/workflows/release-chart.yml'
      - '.github/workflows/test.yml'
      - '.github/workflows/test-e2e.yml'
  pull_request:
    paths-ignore:
      - 'tools/release.py'
      - 'tools/release_ci.py'
      - 'test/release/**'
      - 'test/e2e/run.sh'
      - 'test/e2e/runner_test.sh'
      - 'test/e2e/fixture_overlay.py'
      - 'test/e2e/fixtures/migration.sh'
      - 'test/e2e/fixture_overlay_test.py'
      - 'test/e2e/migration_fixture_test.py'
      - 'charts/**'
      - 'docs/**'
      - '.github/workflows/release-image.yml'
      - '.github/workflows/release-chart.yml'
      - '.github/workflows/test.yml'
      - '.github/workflows/test-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        postgres: [15, 16, 17, 18]
    env:
      EPCO_PG_VERSION: ${{ matrix.postgres }}
      EPCO_ARTIFACTS_DIR: artifacts/e2e/pg${{ matrix.postgres }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.15
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Run tests
        run: mise run test-e2e
      - name: Check sources
        if: always()
        run: git diff --exit-code
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-pg${{ matrix.postgres }}
          path: artifacts/
          if-no-files-found: warn
  e2e-required:
    name: E2E
    if: always()
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all PostgreSQL versions
        env:
          MATRIX_RESULT: ${{ needs.e2e.result }}
        run: test "$MATRIX_RESULT" = success
