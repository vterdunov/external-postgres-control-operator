name: E2E Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Kind deployment smoke (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned mise
        run: |
          curl --fail --location --retry 3 https://github.com/jdx/mise/releases/download/v2026.9.15/mise-v2026.9.15-linux-x64.tar.gz -o "$RUNNER_TEMP/mise.tar.gz"
          tar -xzf "$RUNNER_TEMP/mise.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/mise/bin" >> "$GITHUB_PATH"
      - name: Install pinned tools
        run: |
          mise trust mise.toml
          mise install
      - name: Installed operator smoke tests
        run: mise run test-e2e
      - name: Verify tests did not modify tracked sources
        if: always()
        run: git diff --exit-code
      - name: Upload reports and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e
          path: artifacts/
          if-no-files-found: warn
