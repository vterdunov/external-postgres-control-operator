---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - postgresql.epco.io
  resources:
  - postgresclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - postgresql.epco.io
  resources:
  - postgresclusters/status
  verbs:
  - get
  - patch
  - update
